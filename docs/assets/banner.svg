    </g>
    <rect x="62" y="31" width="200" height="15" rx="4" fill="#F4B4A8" opacity="0.8"/>
    <rect x="62" y="59" width="170" height="15" rx="4" fill="#A7E3C8" opacity="0.85"/>
    <rect x="62" y="87" width="210" height="15" rx="4" fill="#D9B8F2" opacity="0.8"/>
