      <stop offset="0" stop-color="#1B2A55"/><stop offset="0.55" stop-color="#24459A"/><stop offset="1" stop-color="#0F8A86"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.2" r="0.6"><stop offset="0" stop-color="#4FD1C5" stop-opacity="0.45"/><stop offset="1" stop-color="#4FD1C5" stop-opacity="0"/></radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EEF2F8"/></linearGradient>
